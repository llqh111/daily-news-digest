name: 📰 Daily News Digest

on:
  # ⚠️ 唯一触发源 = cron-job.org（外部定时调用 workflow_dispatch）。
  #    历史上 GitHub 自带 schedule 与 cron-job.org 同时在跑 → 同一班次被触发两次
  #    → 微信收到两条。已移除 schedule，只保留 workflow_dispatch，调度交给 cron-job.org。
  #
  #    ⚠️ cron-job.org 调用时【不要】传 inputs.force=true：
  #       force 会在 main.py 里短路掉 should_skip_session() 去重三层防线，
  #       一旦 cron-job.org 重试/配多个任务就会重复推送。让去重当最后兜底。
  #
  #    若 cron-job.org 失效需临时恢复定时，可在此重新加回 schedule:（注意会与
  #    cron-job.org 叠加，二选一）。也可在 GitHub 网页上手动点 workflow_dispatch。
  workflow_dispatch:
    inputs:
      force:
        description: '强制执行（跳过去重检查）'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# 同一时段只允许一个 job 跑，防止多个 cron 同时触发导致重复推送
concurrency:
  group: digest-lock
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest

    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🐍 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 📦 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 运行单元测试（不过就不推送）
        run: python -m pytest test_core.py -q

      - name: 📰 运行每日简报
        run: |
          if [ "${{ github.event.inputs.force }}" == "true" ]; then
            python main.py --force
          else
            python main.py
          fi

      - name: 💾 提交推送记录（避免早晚报重复）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_articles.json digests/ sent_github_repos.json
          if git diff --cached --quiet; then
            echo "推送记录无变化，跳过提交"
          else
            git commit -m "更新推送记录 [skip ci]"
            # 先 rebase 拉取远端最新，避免与并发/手动触发的提交撞成 non-fast-forward
            git pull --rebase --autostash
            git push
          fi
