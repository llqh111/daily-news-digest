name: 📰 Daily News Digest

on:
  # ⚠️ GitHub Actions 免费定时任务在「UTC 00:00 附近」最拥堵，经常被延迟甚至丢弃。
  #    早班原三枪全挤在 23:55~00:15 UTC（同一拥堵窗口），遇拥堵一起被丢 → 早上不发。
  #    修复：首枪保持贴近 8 点，后几枪拉开并挪到 UTC 01:00 之后（拥堵明显缓解）。
  #    代码里的 should_skip_session() 去重确保只推送一次，多余兜底自动跳过。
  schedule:
    # ── 早班：北京 07:55 / 08:10 / 08:30 / 09:00 / 09:30 ──
    - cron: "55 23 * * *"  # 北京 07:55 首枪
    - cron: "10 0  * * *"  # 北京 08:10 兜底
    - cron: "30 0  * * *"  # 北京 08:30 兜底
    - cron: "0  1  * * *"  # 北京 09:00 兜底——脱离午夜拥堵
    - cron: "30 1  * * *"  # 北京 09:30 强兜底
    # ── 晚班：北京 19:55 / 20:05 / 20:15（UTC 中午，拥堵轻，维持原样）──
    - cron: "55 11 * * *"  # 晚班第一枪
    - cron: "5  12 * * *"  # 晚班兜底
    - cron: "15 12 * * *"  # 晚班再兜底
  # 也支持手动触发（在 GitHub 网页上点按钮）
  workflow_dispatch:
    inputs:
      force:
        description: '强制执行（跳过去重检查）'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

# 同一时段只允许一个 job 跑，防止多个 cron 同时触发导致重复推送
concurrency:
  group: digest-lock
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest

    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🐍 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 📦 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 运行单元测试（不过就不推送）
        run: python -m pytest test_core.py -q

      - name: 📰 运行每日简报
        run: |
          if [ "${{ github.event.inputs.force }}" == "true" ] || [ "${{ github.event_name }}" == "workflow_dispatch" -a "${{ github.event.inputs.force }}" == "" ]; then
            python main.py --force
          else
            python main.py
          fi

      - name: 💾 提交推送记录（避免早晚报重复）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_articles.json digests/
          if git diff --cached --quiet; then
            echo "推送记录无变化，跳过提交"
          else
            git commit -m "更新推送记录 [skip ci]"
            git push
          fi
