name: 📰 Daily News Digest

on:
  # 每个时段用 3 个 cron 兜底，防止 GitHub 调度偶尔跳过
  # 北京时间 7:55 / 8:05 / 8:15（UTC 23:55 / 0:05 / 0:15）
  # 北京时间 19:55 / 20:05 / 20:15（UTC 11:55 / 12:05 / 12:15）
  schedule:
    - cron: "55 23 * * *"  # 早班第一枪
    - cron: "5  0  * * *"  # 早班兜底
    - cron: "15 0  * * *"  # 早班再兜底
    - cron: "55 11 * * *"  # 晚班第一枪
    - cron: "5  12 * * *"  # 晚班兜底
    - cron: "15 12 * * *"  # 晚班再兜底
  # 也支持手动触发（在 GitHub 网页上点按钮）
  workflow_dispatch:

permissions:
  contents: write

# 同一时段只允许一个 job 跑，防止多个 cron 同时触发导致重复推送
concurrency:
  group: digest-${{ github.event.schedule || github.run_id }}
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest

    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🐍 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 📦 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 📰 运行每日简报
        run: python main.py

      - name: 💾 提交推送记录（避免早晚报重复）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_articles.json
          if git diff --cached --quiet; then
            echo "推送记录无变化，跳过提交"
          else
            git commit -m "更新推送记录 [skip ci]"
            git push
          fi
